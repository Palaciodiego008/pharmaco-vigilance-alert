version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: pharmacovigilance_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pharmacovigilance
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: pharma_user
      MYSQL_PASSWORD: pharma_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pharma_network

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmacovigilance_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_DATABASE: pharmacovigilance
      DB_USERNAME: pharma_user
      DB_PASSWORD: pharma_pass
    depends_on:
      - mysql
    networks:
      - pharma_network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmacovigilance_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - pharma_network
    command: npm run dev -- --host

  # phpMyAdmin (optional, for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pharmacovigilance_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: pharma_user
      PMA_PASSWORD: pharma_pass
    depends_on:
      - mysql
    networks:
      - pharma_network

volumes:
  mysql_data:
    driver: local

networks:
  pharma_network:
    driver: bridge
